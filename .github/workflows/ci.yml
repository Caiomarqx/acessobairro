
name: Validacao do Front-end

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Build e Lint
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci


      - name: Verificar qualidade do codigo
        run: npm run lint

      - name: Executar testes automatizados
        run: npm run test

      - name: Compilar projeto
        run: npm run build